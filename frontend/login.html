<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Inicio de Sesión</title>
    <style>
      /* Puedes usar los mismos estilos que el formulario de registro */
      body {
        font-family: sans-serif;
        display: grid;
        place-content: center;
        height: 100vh;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 300px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      input {
        padding: 8px;
      }
      button {
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
      }
      #mensaje {
        margin-top: 15px;
        font-weight: bold;
      }
      .exito {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" required />

      <label for="password">Contraseña:</label>
      <input type="password" id="password" required />

      <button type="submit">Entrar</button>
    </form>
    <div id="mensaje"></div>

    <script src="asset/js/login.js"></script>
  </body>
</html>
